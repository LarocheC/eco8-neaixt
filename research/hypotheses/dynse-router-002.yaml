id: dynse-router-002
question: >
  Does chunked budget-conditioned routing save measured board-level energy on
  STM32N6 at non-inferior quality?
status: proposed
created: 2026-08-09

mechanism: >
  Easy chunks (silence, steady stationary noise) need fewer active channels than
  transients. A router conditioned on a cheap chunk-level feature plus a budget
  token can skip channels, cutting NPU epochs and therefore energy. The saving is
  claimed at the board, not in MACs.
prediction: >
  Quality non-inferior to the compute-matched static (PESQ delta >= -0.02), with
  >= 15% reduction in measured board-level energy per second of audio.

falsify_if: >
  A compute-matched static reaches the same or better quality at the same
  *measured* board cost. That is the rival explanation and it is the likely one:
  a dynamic model that wins only against `always_full` has shown nothing, and
  MAC savings on this target do not imply energy savings (the dense NSNet2 is
  memory-bound at RTF 1.43 on N6 while a 4x smaller-MAC structured variant hits
  0.13). Also falsified if router overhead plus per-chunk reconfiguration cost
  eats the saving on silicon even when the MAC saving is real.
accept_if: >
  Quality non-inferior on all three seeds AND measured energy reduction >= 15%
  versus the compute-matched static, both measured on the same board in the same
  session, with P99 per-frame latency still inside the 16 ms hop deadline.

baselines:
  - name: compute_matched_static
    why: the load-bearing comparison; matched on MEASURED board cost, not MACs
  - name: always_full
    why: quality ceiling only
controls:
  - identical training data and optimisation budget as the static pool
  - identical calibration set for int8 export
  - same board, same session, same stedgeai version for every timing
  - energy measured end-to-end on the compiled target, not modelled
  - router overhead included in the routed configuration's cost

primary_metric: paired_quality_delta
secondary_metrics: [board_energy_per_second, p50_latency_ms, p99_latency_ms, npu_sw_epoch_count]
split: train_holdout
seeds: [13, 37, 71]
budget: 12_gpu_hours + 1_board_session

critique: null
depends_on: [dynse-oracle-001]
experiments: []
outcome: null
