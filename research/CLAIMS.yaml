# Claim–evidence matrix.
#
# Every assertion this project makes in a README, a RESULTS_*.md, a model card
# or a paper should have an id here. If it does not, it is not a claim yet.
#
# Schema: research/SCHEMA.md. Validated by tools/research_lint.py.
#
# NOTE ON THE CURRENT STATE (2026-08-09): this file was seeded by reading the
# existing results documents. Most entries carry an `evidence_gap` because their
# evidence is a hand-maintained markdown table rather than a generated artifact.
# That is the honest position and it is the backlog: the goal is for
# `evidence_gap` to disappear, not for it to go unmentioned. `benchmarks/` is the
# one area already at the target standard.

claims:

  - id: perceptual-suite-cross-family
    statement: >
      Every published checkpoint has been scored on PESQ, DNSMOS, NISQA and
      SCOREQ under one harness, with every individual utterance score retained.
    kind: measured
    status: measured
    evidence:
      - benchmarks/summary.json
      - benchmarks/per_utterance.json.gz
      - RESULTS_METRICS.md
      - common/quality.py
    counterevidence: []
    scope: >
      44 conditions x 824 utterances x 12 metrics on the VoiceBank-DEMAND test
      split. Aggregate means are reproducible from the per-utterance file; both
      carry a provenance block (dataset, git commit, package versions).
    # No evidence_gap: the tables are generated by benchmarks/report.py from the
    # committed artifacts. This is the standard every other claim should reach.

  - id: monarch-beats-blockdiag-marginally
    statement: >
      Genuine two-factor Monarch is consistently but marginally better than a
      single block-diagonal factor (+0.011 to +0.038 FP32 PESQ at matched
      nblocks), and costs parameters to get there.
    kind: measured
    status: measured
    evidence:
      - RESULTS_NSNET2.md#genuine-two-factor-monarch
      - EXPERIMENT_MONARCH.md
      - configs/monarch_8.json
      - configs/blockdiag_8.json
    counterevidence:
      - >
        The gap is of the same order as the metric's run-to-run noise, and the
        pairs are not parameter-matched (Monarch's second factor makes it larger
        at equal nblocks). See claim `capacity-saturates`.
    scope: NSNet2 trunk only, 200 epochs, batch 256, n_fft 512, VBD.
    evidence_gap: >
      Markdown table, no run manifests. Single seed per configuration, so the
      +0.011 end of the range is not separable from noise. Backfill needed.

  - id: structured-int8-lossfree
    statement: >
      Block-diagonal and genuine-Monarch NSNet2 variants are int8-loss-free
      (|delta PESQ| <= 0.018 and <= 0.012 respectively) with the structured
      weights genuinely quantized.
    kind: measured
    status: corrected
    evidence:
      - RESULTS_NSNET2.md   # see the int8-correction notice at the top
      - nsnet2/qdq_einsum_quantizer.py
      - nsnet2/quant.py     # audit: fails if any Einsum operand is a raw FLOAT initializer
    counterevidence:
      - >
        Every int8 number published before 2026-07-11 was measured on a model
        whose structured weights were still FP32. The claim survived
        re-measurement, but it was not evidenced when first made. See
        research/FAILURES.md#einsum-int8.
    scope: >
      General-purpose streaming ONNX under onnxruntime CPU. The STM32N6 export
      path re-expresses blocks as per-block MatMul and was never affected.
    evidence_gap: Markdown table, no run manifests.

  - id: capacity-saturates
    statement: >
      Enhancement quality on VBD saturates with capacity: across three structure
      families and roughly 10x parameters (0.36 M to 3.64 M), FP32 PESQ spans
      only ~2.81-2.88, and is not monotonic in parameter count.
    kind: measured
    status: measured
    evidence:
      - RESULTS_NSNET2.md#quality-is-capacity-bound-no-it-saturates
    counterevidence: []
    scope: >
      NSNet2 trunk, one training recipe, one dataset. Says nothing about other
      architectures or about data scaling.
    evidence_gap: >
      Single seed per configuration. The strongest use of this claim (as a prior
      against dynamic-capacity work) deserves multi-seed confirmation.

  - id: lisennet-reproduction
    statement: >
      The LiSenNet port reaches PESQ 3.006 on the full 824-utterance VBD test
      split, within ~0.06 of the paper's reported ~3.07.
    kind: measured
    status: measured
    evidence:
      - RESULTS_LISENNET.md
      - lisennet/model.py
    counterevidence: []
    scope: Offline, FP32, Griffin-Lim phase. Not the real-time configuration.
    evidence_gap: Markdown table, no run manifest.

  - id: lisennet-n6-streaming-deployed
    statement: >
      The LiSenNet nc24 conv variant runs frame-by-frame on STM32N6 Neural-ART
      silicon at 2.791 ms/frame (RTF 0.174, 16 ms hop latency), fully on-chip,
      at int8 PESQ 2.963 on the full test split.
    kind: measured
    status: measured
    evidence:
      - LISENNET_NPU_HANDOVER.md
      - RESULTS_LISENNET.md
      - deploy/stm32n6/ONBOARD_MEASUREMENT.md
    counterevidence: []
    scope: >
      stedgeai 4.0.1, n6-noextmem, STM32N6570-DK, noisy-phase real-time path.
      Latency only — no energy measurement has been taken on this target.
    evidence_gap: >
      No board-session manifest (board id, firmware, ambient conditions, run
      timestamps). Energy is entirely unmeasured; do not let a latency number
      become an energy claim.

  - id: cost-not-predicted-by-parameters
    statement: >
      On STM32N6, cost is not predicted by parameter or MAC count: the 2.78 M
      dense NSNet2 is memory-bound at 22.94 ms/frame (RTF 1.43, weights overflow
      on-chip RAM) while the 1.10 M structured monarch_full reaches 2.13 ms/frame
      (RTF 0.13) with weights resident on-chip.
    kind: measured
    status: measured
    evidence:
      - deploy/stm32n6/README.md
      - deploy/stm32n6/NSNET2_DEPLOYMENT_NOTES.md
    counterevidence: []
    scope: >
      STM32N6570-DK, stedgeai 4.0.1. The mechanism is weight locality, so the
      conclusion generalises to targets with a similar on-chip/off-chip cliff and
      not necessarily beyond.
    evidence_gap: Markdown table, no board-session manifest.

  - id: convfsenet-m55-software-share
    statement: >
      After the weight-locality fix, the dominant remaining ConvFSENet frame cost
      is the Cortex-M55 software share, and it is dominated by 9 Gather ops (the
      dilation tap-select), not by a float round-trip on the FIFO state path.
    kind: measured
    status: corrected
    evidence:
      - deploy/stm32n6/TODO.md
    counterevidence:
      - >
        The original framing ("the QDQ PTQ wraps the state path in a float
        round-trip") was over-stated: the state Slice/Concat are Hybrid, not
        pure-SW. Recorded rather than deleted.
    scope: ConvFSENet int8 streaming graph, stedgeai 4.0.1, generate-only profile.
    evidence_gap: Prose in a TODO file; the per-epoch profile output is not committed.

  - id: lisennet-npu-blockers
    statement: >
      Four specific constructs block the Neural-ART compiler for this model
      class: 2-axis LayerNorm, per-channel-float activations (PReLU/Mish), rank-5
      tensors from SPConvTranspose2d, and Pad with an empty optional
      constant_value input.
    kind: measured
    status: measured
    evidence:
      - LISENNET_NPU_HANDOVER.md
      - lisennet/export_onnx.py   # _strip_empty_pad_value_inputs
      - configs/lisennet_conv_hardened_nc24.json
    counterevidence:
      - >
        Blocker #4's first diagnosis (FIFO state I/O) was wrong; state I/O is
        innocent. Five bisection rounds to the real cause. Kept as a reminder
        that the symptom was not the mechanism.
    scope: >
      atonn / stedgeai 4.0.1 specifically. Blocker #4 needs the dual-branch
      sub-band context to reproduce; single-path graphs with the same Pad form
      compile fine.

  - id: dynamic-routing-saves-energy
    statement: >
      Chunked budget-conditioned routing reduces measured board-level energy at
      non-inferior quality.
    kind: hypothesis
    status: unverified
    evidence: []
    counterevidence:
      - >
        research/CLAIMS.yaml#capacity-saturates — if quality is flat across 10x
        capacity, there may be no per-chunk headroom to exploit at all.
      - >
        research/CLAIMS.yaml#cost-not-predicted-by-parameters — a MAC saving on
        this target does not imply an energy saving.
    scope: Nothing measured. Gated behind research/hypotheses/dynse-oracle-001.yaml.
