[project]
name = "eco8-neaixt"
version = "0.1.0"
description = "Efficient, quantized, streamable speech-enhancement models for edge-AI benchmarking in the context of the NeAIxt project."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.6,<2.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "librosa>=0.10",
    "tensorboard>=2.14",
    "joblib>=1.3",
    "pesq>=0.0.4",
    "torch-pesq>=0.1.2",  # GPU MetricGAN target, ~11x faster than the CPU reference above. The REPORTED PESQ still uses `pesq` (ITU-T P.862) — see common/discriminator.py.
    "datasets>=2.14,<4",
    "huggingface_hub>=0.20",
    "rich>=13.0",
    "einops>=0.7",
    "opt_einsum>=3.3",
    "torch-structured>=1.3.0",  # 1.3.0 is the first release exposing MonarchLinear (genuine 2-factor Monarch)
    "gru-qat[triton,structured]>=0.5.0",  # 0.4.0 split kinds into diagonal/blockdiag/monarch; 0.5.0 adds fused (shared-w1) Monarch GRU (param-parity with native)
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "onnx>=1.21,<1.22",          # DET-01
    "onnxruntime>=1.25,<1.26",   # DET-01
    # Perceptual-quality metrics (common/quality.py).
    # torchmetrics carries both DNSMOS (official MS P.835 ONNX) and NISQA v2
    # (weights from the author's repo); the standalone `nisqa` PyPI package is
    # unusable here because it hard-pins torch==2.2.1.
    "torchmetrics>=1.9",
    "requests>=2.31",            # DNSMOS/NISQA gate their imports on this
    "torchaudio>=2.7,<2.8",      # SCOREQ resampling; must track torch
    "scoreq>=1.0.1",             # ONNX backend by default (the `pytorch` extra needs fairseq)
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

# CUDA 12.8, not 11.8. The cu118 wheels only ship kernels up to sm_90, so on a
# Blackwell card (RTX 6000 Pro / RTX 50-series, sm_120) EVERY cuda op dies with
#   RuntimeError: CUDA error: no kernel image is available for execution on the device
# on the first launch. Same torch version (2.7.1), different CUDA build.
#
# Safe on the older cards too: the cu128 arch list is
#   sm_75 sm_80 sm_86 sm_90 sm_100 sm_120 compute_120
# which has no explicit sm_89 — but neither did cu118, and the RTX 4090 (sm_89)
# runs fine on it, because cubins are forward-compatible across minor versions
# within a major arch (sm_86 -> sm_89). Verified by running conv/pad/GRU on a
# 4090 under this exact build.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` gates the tests that download model weights / read the real VBD split.
# Deselected by default; run them with `-m slow`.
addopts = "-m 'not slow'"
markers = [
    "slow: needs network + cached model weights (DNSMOS/NISQA/SCOREQ, VBD split)",
]
