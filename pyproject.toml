[project]
name = "eco8-neaixt"
version = "0.1.0"
description = "Efficient, quantized, streamable speech-enhancement models for edge-AI benchmarking in the context of the NeAIxt project."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.6,<2.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "librosa>=0.10",
    "tensorboard>=2.14",
    "joblib>=1.3",
    "pesq>=0.0.4",
    "datasets>=2.14,<4",
    "huggingface_hub>=0.20",
    "rich>=13.0",
    "einops>=0.7",
    "opt_einsum>=3.3",
    "torch-structured>=1.2.4",  # 1.2.4 fixes Butterfly non-contiguous Triton input
    "gru-qat[triton,structured]>=0.2.0",
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "onnx>=1.21,<1.22",          # DET-01
    "onnxruntime>=1.25,<1.26",   # DET-01
    # Perceptual-quality metrics (common/quality.py).
    # torchmetrics carries both DNSMOS (official MS P.835 ONNX) and NISQA v2
    # (weights from the author's repo); the standalone `nisqa` PyPI package is
    # unusable here because it hard-pins torch==2.2.1.
    "torchmetrics>=1.9",
    "requests>=2.31",            # DNSMOS/NISQA gate their imports on this
    "torchaudio>=2.7,<2.8",      # SCOREQ resampling; must track torch
    "scoreq>=1.0.1",             # ONNX backend by default (the `pytorch` extra needs fairseq)
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` gates the tests that download model weights / read the real VBD split.
# Deselected by default; run them with `-m slow`.
addopts = "-m 'not slow'"
markers = [
    "slow: needs network + cached model weights (DNSMOS/NISQA/SCOREQ, VBD split)",
]
