# DSP (HiFi4) Kconfig for the LiSenNet SE offload.
# Pulls the prebuilt HiFi4 TFLite-Micro kernel library (xa_nnlib int8 kernels) — the same
# component the tflm_kws_hifi4 example uses. This is what makes Conv2D/DepthwiseConv2D/
# TransposeConv/Logistic dispatch to the accelerated HiFi4 kernels instead of reference.
CONFIG_MCUX_COMPONENT_middleware.eiq.tensorflow_lite_micro.binary=y
CONFIG_MCUX_COMPONENT_middleware.eiq.tensorflow_lite_micro.third_party.fft2d=y

# C++ (TFLM is C++), math, and the debug console for the DSP-side status prints.
CONFIG_MCUX_PRJSEG_module.board.console=y

# TODO(toolchain-box): if the shared se_ipc block is cacheable, enable the Xtensa dcache
# ops used in dsp_main.cpp; recommended instead is to place it in a non-cacheable SRAM
# partition (see README "cache coherency") and leave the ipc_* helpers as no-ops.
